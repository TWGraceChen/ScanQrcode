<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" type="text/css" href="/static/styles.css">
</head>
<body>
    <nav>
        <div class="nav-title">{{.Title}}</div>
        <div>
            <a href="/">報到</a>
            <a href="/search">查詢</a>
            <a href="/report" class="active">報表</a>
            <a href="/admin">管理</a>
        </div>
    </nav>

    <div class="content">
        <div class="form-container">
            <div class="form-item">
                <label><b>姓名</b></label>
                <input type="text" id="name" name="name" />
            </div>
            
            {{range .SearchFields}}
            <div class="form-item">
                <label><b>{{.Label}}</b></label>
                <select id="attr-{{.Key}}" class="dynamic-attr" data-key="{{.Key}}" data-label="{{.Label}}">
                    {{range .Options}}
                        <option value="{{.}}">{{.}}</option>
                    {{end}}
                </select>
            </div>
            {{end}}

            <div class="form-item">
                <label><b>次數(大於等於)</b></label>
                <select id="ge">
                    {{range .Times}}
                        <option value="{{.}}">{{.}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-item">
                <label><b>次數(小於等於)</b></label>
                <select id="le">
                    {{range .Times}}
                        <option value="{{.}}">{{.}}</option>
                    {{end}}
                </select>
            </div>
            <button type="button" id="search-button" class="btn btn-primary">查詢</button>
        </div>
        <!-- Results Table -->
        <div class="table-container">
            <table>
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script>
        document.getElementById('search-button').addEventListener('click', function () {
            const name = document.getElementById('name').value;
            const ge = document.getElementById('ge').value;
            const le = document.getElementById('le').value;

            const attributes = {};
            const searchKeys = [];
            const searchLabels = [];
            
            document.querySelectorAll('.dynamic-attr').forEach(el => {
                attributes[el.dataset.key] = el.value;
                searchKeys.push(el.dataset.key);
                searchLabels.push(el.dataset.label);
            });
    
            const data = {
                name: name,
                ge: ge,
                le: le,
                attributes: attributes
            };
    
            fetch('/api/report', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                const tableBody = document.querySelector('tbody');
                const tableHead = document.querySelector('thead');
    
                tableBody.innerHTML = '';
                tableHead.innerHTML = '';

                const headRow = document.createElement('tr');
                let dynamicHeaders = '';
                searchLabels.forEach(label => {
                    dynamicHeaders += `<th>${label}</th>`;
                });

                headRow.innerHTML = `
                    <th>ID</th>
                    <th>姓名</th>
                    ${dynamicHeaders}
                    <th>次數</th>
                `;
                tableHead.appendChild(headRow);
    
                if (result && result.length > 0) {
                    result.forEach(row => {
                        const tr = document.createElement('tr');
                        let dynamicCols = '';
                        searchKeys.forEach(k => {
                            dynamicCols += `<td>${(row.attributes && row.attributes[k]) ? row.attributes[k] : ''}</td>`;
                        });
                        tr.innerHTML = `
                            <td>${row.id}</td>
                            <td>${row.name}</td>
                            ${dynamicCols}
                            <td>${row.times}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                } else {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td colspan="${3 + searchLabels.length}">沒有查詢結果</td>`;
                    tableBody.appendChild(tr);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
        
        const selectElement = document.getElementById('le');
        selectElement.selectedIndex = selectElement.options.length - 1;
    </script>
</body>
</html>
