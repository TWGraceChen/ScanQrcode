<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" type="text/css" href="/static/styles.css">
</head>

<body>
    <nav>
        <div class="nav-title">{{.Title}}</div>
        <div>
            <a href="/">報到</a>
            <a href="/search">查詢</a>
            <a href="/report">報表</a>
            <a href="/admin" class="active">管理</a>
        </div>
    </nav>
    <div id="toast-container" class="toast-container"></div>
    <div class="content" style="align-items: center; max-width: 600px;">

        <div class="card admin-section">
            <h3>活動場次設定</h3>
            <div class="form-group">
                <label>請輸入場次名稱 (每行一個)</label>
                <textarea id="acts-input" placeholder="例如:&#10;一晚&#10;二早"></textarea>
            </div>
        </div>

        <div class="card admin-section">
            <h3>查詢欄位設定</h3>
            <p style="font-size: 14px; color: #666;">定義 JSON 屬性 Key 與對應的中文名稱。</p>
            <div id="fields-container"></div>
            <button type="button" class="btn" id="add-field-btn">+ 新增欄位</button>
        </div>

        <button type="button" class="btn btn-success" id="save-btn" style="width: 100%; margin-top: 10px;">儲存設定</button>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchSettings();
        });

        function showToast(message, isSuccess) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isSuccess ? 'success' : 'error'}`;
            toast.innerHTML = isSuccess ? `✅ ${message}` : `❌ ${message}`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function fetchSettings() {
            fetch('/api/settings')
                .then(res => res.json())
                .then(data => {
                    if (data.acts) {
                        document.getElementById('acts-input').value = data.acts.join('\n');
                    }
                    const container = document.getElementById('fields-container');
                    container.innerHTML = '';
                    if (data.search_fields) {
                        data.search_fields.forEach(f => addFieldRow(f.key, f.label));
                    }
                });
        }

        function addFieldRow(key = '', label = '') {
            const container = document.getElementById('fields-container');
            const row = document.createElement('div');
            row.className = 'field-row';
            row.innerHTML = `
                <input type="text" placeholder="JSON Key (例如: company)" value="${key}" class="f-key">
                <input type="text" placeholder="顯示名稱 (例如: 公司)" value="${label}" class="f-label">
                <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()">刪除</button>
            `;
            container.appendChild(row);
        }

        document.getElementById('add-field-btn').addEventListener('click', () => {
            addFieldRow();
        });

        document.getElementById('save-btn').addEventListener('click', () => {
            const actsText = document.getElementById('acts-input').value;
            const acts = actsText.split('\n').map(a => a.trim()).filter(a => a !== '');

            const searchFields = [];
            document.querySelectorAll('.field-row').forEach(row => {
                const key = row.querySelector('.f-key').value.trim();
                const label = row.querySelector('.f-label').value.trim();
                if (key && label) {
                    searchFields.push({ key, label });
                }
            });

            const payload = { acts, search_fields: searchFields };

            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(res => res.json())
                .then(data => {
                    showToast('設定已成功儲存！', true);
                })
                .catch(err => {
                    showToast('儲存失敗', false);
                    console.error(err);
                });
        });
    </script>
</body>

</html>
