<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" type="text/css" href="/static/styles.css">
</head>
<body>
    <nav>
        <div class="nav-title">{{.Title}}</div>
        <div>
            <a href="/">報到</a>
            <a href="/search" class="active">查詢</a>
            <a href="/report">報表</a>
            <a href="/admin">管理</a>
        </div>
    </nav>
    <div class="content">
        <div class="form-container">
            <div class="form-item">
                <label><b>姓名</b></label>
                <input type="text" id="name" name="name" />
            </div>
            
            {{range .SearchFields}}
            <div class="form-item">
                <label><b>{{.Label}}</b></label>
                <select id="attr-{{.Key}}" class="dynamic-attr" data-key="{{.Key}}" data-label="{{.Label}}">
                    {{range .Options}}
                        <option value="{{.}}">{{.}}</option>
                    {{end}}
                </select>
            </div>
            {{end}}

            <div class="form-item">
                <label><b>場次</b></label>
                <select id="act-list">
                    {{range .Acts}}
                        <option value="{{.}}">{{.}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-item">
                <label>&nbsp;</label>
                <button type="button" id="search-button" class="btn btn-primary">查詢</button>
            </div>
        </div>
        <!-- Results Table -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; margin-top: 12px;">
            <h3 style="margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--text-main);">查詢結果</h3>
            <div id="total-count" class="total-count-badge" style="display: none;"></div>
        </div>
        <div class="table-container">
            <table>
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script>
        document.getElementById('search-button').addEventListener('click', function () {
            const name = document.getElementById('name').value;
            const act = document.getElementById('act-list').value;
            
            const attributes = {};
            const searchKeys = [];
            const searchLabels = [];
            
            document.querySelectorAll('.dynamic-attr').forEach(el => {
                attributes[el.dataset.key] = el.value;
                searchKeys.push(el.dataset.key);
                searchLabels.push(el.dataset.label);
            });
    
            const data = {
                name: name,
                act: act,
                attributes: attributes
            };
    
            fetch('/api/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                const tableBody = document.querySelector('tbody');
                const tableHead = document.querySelector('thead');
    
                tableBody.innerHTML = '';
                tableHead.innerHTML = '';

                const headRow = document.createElement('tr');
                let dynamicHeaders = '';
                searchLabels.forEach(label => {
                    dynamicHeaders += `<th>${label}</th>`;
                });

                headRow.innerHTML = `
                    <th>序號</th>
                    <th>ID</th>
                    <th>姓名</th>
                    ${dynamicHeaders}
                    <th>場次</th>
                    <th>時間</th>
                `;
                tableHead.appendChild(headRow);
    
                const totalCountDiv = document.getElementById('total-count');
                const userIconSVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 16px; height: 16px; margin-right: 6px;"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>`;
                if (result && result.length > 0) {
                    totalCountDiv.style.display = 'inline-flex';
                    totalCountDiv.innerHTML = `${userIconSVG}總人數: ${result.length}`;
                    result.forEach((row, index) => {
                        const tr = document.createElement('tr');
                        let dynamicCols = '';
                        searchKeys.forEach(k => {
                            dynamicCols += `<td>${(row.attributes && row.attributes[k]) ? row.attributes[k] : ''}</td>`;
                        });
                        tr.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${row.id}</td>
                            <td>${row.name}</td>
                            ${dynamicCols}
                            <td>${row.act}</td>
                            <td>${row.checkinTime}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                } else {
                    totalCountDiv.style.display = 'inline-flex';
                    totalCountDiv.innerHTML = `${userIconSVG}總人數: 0`;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td colspan="${5 + searchLabels.length}">沒有查詢結果</td>`;
                    tableBody.appendChild(tr);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
